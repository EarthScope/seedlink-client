[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "seedlink-client"
dynamic = ["version"]
description = "SeedLink protocol 3.x and 4.x client for streaming geophysical (primarily seismic) data"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    { name = "EarthScope Data Services", email = "software@earthscope.org" },
]
keywords = ["seedlink", "seismology", "ringserver", "earthscope"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
]
dependencies = ["pymseed>=0.9.3"]

[project.urls]
Homepage = "https://github.com/EarthScope/seedlink-client"
Repository = "https://github.com/EarthScope/seedlink-client"
Issues = "https://github.com/EarthScope/seedlink-client/issues"
Changelog = "https://github.com/EarthScope/seedlink-client/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = ["pytest>=7.0"]
lint = ["ruff"]

[project.scripts]
seedlink-client = "seedlink_client.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.version]
path = "src/seedlink_client/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/seedlink_client"]

[tool.hatch.build.targets.sdist]
include = ["src/seedlink_client", "tests", "CHANGELOG.md", "README.md", "LICENSE"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# timezone.utc is used consistently and deliberately throughout; UP017's
# datetime.UTC alias (3.11+) is a style preference, not a fix.
ignore = ["UP017"]
